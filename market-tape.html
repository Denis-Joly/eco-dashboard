<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src https://s3.tradingview.com; style-src 'unsafe-inline'; img-src https: data:; connect-src https:; frame-src https:; font-src https: data:; base-uri 'none'; form-action 'none'"
    />
    <title>Provider-hosted market display</title>
    <style>
      :root { color-scheme: dark; background: #0b211d; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background: #0b211d; font-family: Inter, Arial, sans-serif; }
      .tradingview-widget-container { display: grid; width: 100%; height: 100%; grid-template-rows: minmax(0, 1fr) auto; }
      .tradingview-widget-container__widget { width: 100%; height: 100%; min-height: 0; }
      .tradingview-widget-copyright { padding: 5px 8px 0; color: #9db3aa; font-size: 11px; }
      .tradingview-widget-copyright a { color: #90f0c4; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <div class="tradingview-widget-copyright">
        <a href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank">Market data by TradingView</a>
      </div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js" async>
        {
          "symbols": [
            ["S&P 500 futures", "CME_MINI:ES1!|1D"],
            ["Nasdaq 100 futures", "CME_MINI:NQ1!|1D"],
            ["10Y Treasury note futures", "CBOT:ZN1!|1D"],
            ["VIX futures", "CBOE:VX1!|1D"]
          ],
          "chartOnly": false,
          "width": "100%",
          "height": "100%",
          "locale": "en",
          "colorTheme": "dark",
          "autosize": true,
          "showVolume": false,
          "showMA": false,
          "hideDateRanges": false,
          "hideMarketStatus": false,
          "hideSymbolLogo": true,
          "scalePosition": "right",
          "scaleMode": "Normal",
          "fontSize": "10",
          "noTimeScale": false,
          "valuesTracking": "1",
          "changeMode": "price-and-percent",
          "chartType": "area",
          "lineWidth": 2,
          "lineType": 0,
          "dateRanges": ["1d|1", "1m|30", "3m|60", "12m|1D", "60m|1W", "all|1M"],
          "backgroundColor": "#0b211d",
          "gridLineColor": "rgba(214,230,214,0.08)",
          "fontColor": "#9db3aa",
          "widgetFontColor": "#f3f5e9",
          "upColor": "#90f0c4",
          "downColor": "#ff8e72",
          "borderUpColor": "#90f0c4",
          "borderDownColor": "#ff8e72",
          "wickUpColor": "#90f0c4",
          "wickDownColor": "#ff8e72"
        }
      </script>
    </div>
  </body>
</html>
